<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true">
  <defs>
    <linearGradient id="diamondGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#dbeafe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="diamondDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="diamondSoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <ellipse cx="60" cy="108" rx="34" ry="8" fill="#cbd5e1" opacity="0.35"/>
  <g filter="url(#diamondSoftGlow)">
    <polygon points="60,8 92,38 60,112 28,38" fill="url(#diamondGlow)" stroke="#94a3b8" stroke-width="1.2"/>
    <polygon points="60,8 76,38 60,58 44,38" fill="#ffffff" opacity="0.95"/>
    <polygon points="60,58 76,38 92,38 60,112" fill="#bfdbfe" opacity="0.82"/>
    <polygon points="60,58 44,38 28,38 60,112" fill="#93c5fd" opacity="0.72"/>
    <polygon points="60,8 44,38 60,58" fill="#f8fafc" opacity="0.88"/>
    <polygon points="60,58 60,112 76,38" fill="#60a5fa" opacity="0.55"/>
    <polygon points="60,58 60,112 44,38" fill="#3b82f6" opacity="0.42"/>
    <line x1="60" y1="8" x2="60" y2="112" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>
    <line x1="28" y1="38" x2="92" y2="38" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  </g>
</svg>
